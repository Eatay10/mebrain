[project]
name = "cyber-task-hub-api"
version = "1.0.0"
description = "Cyber Task Hub REST API + worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "freezegun>=1.5",
  "datamodel-code-generator[http]>=0.26",
  "pyyaml>=6",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/contract.py", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"app/seed/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ac(id): kabul kriteri eşlemesi, ör. TASK-019/AC-1 (R-TEST-02)"]
