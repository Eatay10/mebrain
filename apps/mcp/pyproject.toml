[project]
name = "cth-mcp"
version = "1.0.0"
description = "Cyber Task Hub MCP sunucusu — REST API üzerinde ince katman"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.9", "httpx>=0.27"]

[project.scripts]
cth-mcp = "cth_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
