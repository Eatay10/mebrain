openapi: 3.1.0
info:
  title: Cyber Task Hub API
  version: 1.0.0
  summary: Siber güvenlik ekipleri için task, proje, etkinlik, yetkinlik, rapor ve bildirim API'si.
  description: |
    Tek kaynak sözleşme. Kurallar: adr/0002-auth-and-rbac.md, adr/0003-api-and-mcp.md.

    - Web istemcisi `cth_session` cookie'si ile kimlik doğrular; durum değiştiren isteklerde `X-CSRF-Token` header'ı zorunludur.
    - Entegrasyonlar ve MCP sunucusu `Authorization: Bearer cth_...` API token'ı kullanır.
    - Denetmen (AUDITOR) rolü tüm kurumu salt-okunur görür; durum değiştiren her istek 403 döner.
    - Kapsam dışındaki kaynaklar için 404, kapsam içinde yetkisiz işlem için 403 döner.
    - Hatalar RFC 9457 `application/problem+json` biçimindedir.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000/api/v1
    description: Yerel geliştirme
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Users
  - name: Teams
  - name: Projects
  - name: Tasks
  - name: Dashboard
  - name: Reports
  - name: Notifications
  - name: Announcements
  - name: Events
  - name: Competencies
  - name: Audit
  - name: Security
  - name: System

paths:
  # ---------------------------------------------------------------- System
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Canlılık kontrolü
      security: []
      responses:
        '200':
          description: Servis ayakta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Hazırlık kontrolü (DB erişimi dahil)
      security: []
      responses:
        '200':
          description: Hazır
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Hazır değil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: E-posta ve parola ile giriş
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Giriş başarılı; `cth_session` ve `cth_csrf` cookie'leri set edilir.
          headers:
            Set-Cookie:
              description: Session ve CSRF cookie'leri
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Geçersiz kimlik bilgisi (hangi alanın yanlış olduğu belirtilmez)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Hesap geçici olarak kilitli
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Oturumu sonlandır
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Çıkış yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Oturumdaki kullanıcı, rolü, kapsamı ve CSRF token'ı
      responses:
        '200':
          description: Oturum bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Me
  /me/api-tokens:
    get:
      tags: [Me]
      operationId: listMyApiTokens
      summary: Kendi API token'larım (secret gösterilmez)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Me]
      operationId: createMyApiToken
      summary: API token oluştur (düz metin yalnızca bu yanıtta döner)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/api-tokens/{tokenId}:
    delete:
      tags: [Me]
      operationId: revokeMyApiToken
      summary: API token'ı iptal et
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: tokenId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: İptal edildi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Kullanıcıları listele (rol kapsamına göre)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: teamId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Kullanıcı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Users]
      operationId: createUser
      summary: Kullanıcı oluştur (direktör)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Kullanıcı detayı
      responses:
        '200':
          description: Kullanıcı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Kullanıcı güncelle; rol ve ekip değişikliği sadece direktör
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Teams
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Görülebilir ekipler
      responses:
        '200':
          description: Ekip listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Ekip oluştur (direktör)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Ekip detayı
      responses:
        '200':
          description: Ekip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: Ekip güncelle (direktör)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Projects
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Projeleri listele (rol kapsamına göre)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: teamId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: watching
          in: query
          description: Sadece yıldız koyduğum projeler
          schema:
            type: boolean
      responses:
        '200':
          description: Proje listesi (ilerleme bilgisiyle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Proje oluştur (yönetici+)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Proje detayı
      responses:
        '200':
          description: Proje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Proje güncelle (yönetici+)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Projeyi sil (soft delete; açık task varsa 409)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- Tasks
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Task'ları listele / ara (rol kapsamına göre)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TaskType'
        - name: status
          in: query
          description: Virgülle birden fazla durum verilebilir
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskPriority'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/TaskCategory'
        - name: teamId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: projectId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: assigneeId
          in: query
          description: '`me` değeri oturumdaki kullanıcıyı ifade eder'
          schema:
            type: string
        - name: overdue
          in: query
          schema:
            type: boolean
        - name: recurring
          in: query
          description: true ise sadece tekrarlayan şablonlar
          schema:
            type: boolean
        - name: dueFrom
          in: query
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            enum: [dueDate, -dueDate, priority, -priority, createdAt, -createdAt, updatedAt, -updatedAt]
            default: -updatedAt
        - name: watching
          in: query
          schema:
            type: boolean
          description: Sadece yıldızlı task'lar
      responses:
        '200':
          description: Task listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Task oluştur
      description: Çalışan sadece kendine atanmış STANDARD task oluşturabilir. PROJECT task'ı için projectId zorunludur.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Task detayı
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Task alanlarını güncelle (durum hariç — transitions kullanın)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Task'ı sil (soft delete, yönetici+)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/transitions:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: transitionTask
      summary: Task durumunu değiştir (geçiş kuralları ADR-0002)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTransition'
      responses:
        '200':
          description: Durum değişti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Geçersiz durum geçişi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskComments
      summary: Task yorumları
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Yorumlar (eskiden yeniye)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tasks]
      operationId: addTaskComment
      summary: Yorum ekle
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/history:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTaskHistory
      summary: Task değişiklik geçmişi (audit kayıtlarından)
      responses:
        '200':
          description: Geçmiş
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Dashboard
  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Ekip bazında durum sayıları (standart / proje ayrımıyla)
      description: |
        Rol kapsamındaki ekipler için sayılar. Tekrarlayan şablonlar sayılmaz, örnekleri sayılır.
        `from`/`to` verilirse task'ın oluşturulma tarihine göre filtrelenir.
      parameters:
        - name: teamId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dashboard özeti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Reports
  /reports/tasks:
    get:
      tags: [Reports]
      operationId: getTaskReport
      summary: Toplu task raporu (JSON veya CSV)
      parameters:
        - name: groupBy
          in: query
          required: true
          schema:
            type: string
            enum: [unit, team, assignee, project, status, priority, category, type]
        - name: teamId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: unitId
          in: query
          description: Sadece bu unit'in ekipleri (kapsam dışı unit → 404)
          schema:
            $ref: '#/components/schemas/Id'
        - name: projectId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
