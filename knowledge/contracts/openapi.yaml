components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cth_session
      description: Web oturumu. Durum değiştiren isteklerde X-CSRF-Token header'ı zorunlu.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: cth_<prefix>_<secret>
      description: Kişisel API token'ı (MCP ve entegrasyonlar). Etkin yetki = token scope'ları ∩ kullanıcı rolü.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie ile kimlik doğrulamada zorunlu; Bearer token ile gerekmez.
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Query:
      name: q
      in: query
      description: Serbest metin arama
      schema:
        type: string
        maxLength: 100
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    BadRequest:
      description: Doğrulama hatası
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Kimlik doğrulanmadı
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Yetki yok
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Bulunamadı veya kapsam dışı
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Çakışma (tekil alan, sürüm uyuşmazlığı, bağımlı kayıt)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit aşıldı
      headers:
        Retry-After:
          description: Saniye
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # -------- primitives / enums
    Id:
      type: string
      format: uuid
    Role:
      type: string
      enum:
        - EMPLOYEE
        - MANAGER
        - UNIT_MANAGER
        - DIRECTOR
        - AUDITOR
      description: 'Organizasyon: Direktör → Unit (UNIT_MANAGER) → Ekip (MANAGER) → Ekip üyesi (EMPLOYEE). AUDITOR salt-okunur.'
    TaskType:
      type: string
      enum: [STANDARD, PROJECT]
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    TaskCategory:
      type: string
      enum: [INCIDENT_RESPONSE, VULNERABILITY_MANAGEMENT, MONITORING, PENETRATION_TEST, COMPLIANCE, THREAT_INTEL, AWARENESS, OPERATIONS, OTHER]
    Recurrence:
      type: string
      enum: [NONE, DAILY, WEEKLY, MONTHLY]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ON_HOLD, COMPLETED, ARCHIVED]
    EventType:
      type: string
      enum: [CONFERENCE, TRAINING, CTF, WEBINAR, WORKSHOP, MEETUP, OTHER]
    EventScope:
      type: string
      enum: [INDIVIDUAL, CORPORATE]
    ParticipationRole:
      type: string
      enum: [ATTENDEE, SPEAKER, ORGANIZER, INSTRUCTOR]
    ParticipationStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, ATTENDED, CANCELLED]
    CompetencyCategory:
      type: string
      enum: [OFFENSIVE, DEFENSIVE, GRC, CLOUD, APPSEC, FORENSICS, NETWORK, OTHER]
    NotificationType:
      type: string
      enum: [TASK_ASSIGNED, TASK_BACKUP_ASSIGNED, TASK_STATUS_CHANGED, TASK_COMMENTED, TASK_DUE_SOON, TASK_OVERDUE, PARTICIPATION_DECIDED, ANNOUNCEMENT, TASK_UPDATED, TASK_PROGRESS, REPORT_READY, COMPETENCY_UPDATED]
    ApiScope:
      type: string
      enum: ['tasks:read', 'tasks:write', 'projects:read', 'reports:read', 'events:read', 'events:write', 'competencies:read']
    SecurityEventType:
      type: string
      enum: [LOGIN_SUCCESS, LOGIN_FAILED, ACCOUNT_LOCKED, LOGOUT, SESSION_EXPIRED, CSRF_REJECTED, AUTHZ_DENIED, NOT_FOUND_PROBE, VALIDATION_REJECTED, PAYLOAD_TOO_LARGE, RATE_LIMITED, ROLE_CHANGED, USER_DEACTIVATED, API_TOKEN_CREATED, API_TOKEN_REVOKED, API_TOKEN_INVALID, BULK_EXPORT]
    SecuritySeverity:
      type: string
      enum: [INFO, LOW, MEDIUM, HIGH]

    # -------- common
    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        checks:
          type: object
          additionalProperties:
            type: string
        version:
          type: string
    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fullName:
          type: string

    # -------- auth
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    Session:
      type: object
      required: [user, csrfToken, visibleTeamIds]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
        visibleTeamIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        managedTeamIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        expiresAt:
          type: string
          format: date-time
    ApiToken:
      type: object
      required: [id, name, prefix, scopes, createdAt, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiScope'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    ApiTokenCreate:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiScope'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Düz metin token — yalnızca bu yanıtta döner

    # -------- users & teams
    User:
      type: object
      required: [id, email, fullName, role, isActive]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        fullName:
          type: string
        title:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        teamId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        teamName:
          type: [string, 'null']
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        unitId:
          oneOf:
            - *id001
            - type: 'null'
          description: Ekibin bağlı olduğu unit veya yönettiği unit
        unitName:
          type:
            - string
            - 'null'
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    UserCreate:
      type: object
      required: [email, fullName, role, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        title:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/Role'
        teamId:
          $ref: '#/components/schemas/Id'
        password:
          type: string
          minLength: 12
          maxLength: 128
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        title:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/Role'
        teamId:
          $ref: '#/components/schemas/Id'
        isActive:
          type: boolean
    Team:
      type: object
      required: [id, name, memberCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: [string, 'null']
        manager:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        memberCount:
          type: integer
          minimum: 0
        unitId:
          oneOf:
            - *id001
            - type: 'null'
        unitName:
          type:
            - string
            - 'null'
    TeamCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        managerId:
          $ref: '#/components/schemas/Id'
        unitId: *id001
    TeamUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        managerId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'

    # -------- projects
        unitId:
          oneOf:
            - *id001
            - type: 'null'
    Project:
      type: object
      required: [id, teamId, name, status, progress, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        teamId:
          $ref: '#/components/schemas/Id'
        teamName:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        owner:
